# startupvalueindex.com — standalone Next.js app on port 4002
# Independent project at /home/dovanlong/startupvalueindex.com
server {
    listen 80;
    listen 443 ssl;
    server_name startupvalueindex.com www.startupvalueindex.com;
    ssl_certificate /etc/nginx/ssl/blockid.crt;
    ssl_certificate_key /etc/nginx/ssl/blockid.key;
    proxy_hide_header X-Powered-By;

    # Ingest (file upload + analysis kick-off) — allow large files and longer read timeout
    # for PDF/PPTX extraction which can take up to 30s for a 25 MB deck.
    location /api/ingest/ {
        client_max_body_size 30M;
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# startupindex.au — 301 mirror to startupvalueindex.com with UTM
server {
    listen 80;
    listen 443 ssl;
    server_name startupindex.au www.startupindex.au;
    ssl_certificate /etc/nginx/ssl/blockid.crt;
    ssl_certificate_key /etc/nginx/ssl/blockid.key;
    return 301 https://startupvalueindex.com$request_uri;
}
