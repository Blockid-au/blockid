server {
    listen 80;
    listen 443 ssl;
    server_name upload.blockid.au;
    ssl_certificate /etc/nginx/ssl/blockid.crt;
    ssl_certificate_key /etc/nginx/ssl/blockid.key;
    client_max_body_size 50M;
    root /home/dovanlong/blockid.au/uploads;

    # Pitch deck PDF (static, outside the repo) — 2026-09-12
    location /pitch/ {
        alias /home/dovanlong/blockid-pitch-2026-09/public/;
        autoindex off;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host blockid.au;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location / {
        autoindex off;
        index index.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}

# Cosmos Chain RPC
server {
    listen 80;
    listen 443 ssl;
    server_name chain.blockid.au;
    ssl_certificate /etc/nginx/ssl/blockid.crt;
    ssl_certificate_key /etc/nginx/ssl/blockid.key;
    
    # EVM JSON-RPC (MetaMask connects here)
    location /evm {
        proxy_pass http://127.0.0.1:8545/;
        proxy_set_header Host $host;
        proxy_set_header Content-Type application/json;
    }
    
    # Cosmos RPC
    location / {
        proxy_pass http://127.0.0.1:26657;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /rest/ {
        proxy_pass http://127.0.0.1:1317/;
    }
}

