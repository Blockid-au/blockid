# BlockID.au — All subdomains

# S31-C capacity audit (2026-09-13): keepalive upstream (no per-request TCP
# to :4001), 310 s + no buffering on AI/stream routes (default 60 s read
# timeout produced 504s on 60-180 s report routes), 120 s elsewhere.
# Rollback: cp /etc/nginx/sites-available/blockid-live.bak-20260913 /etc/nginx/sites-available/blockid-live && nginx -s reload
upstream blockid_app {
    server 127.0.0.1:4001;
    keepalive 64;
}

# G15-R2 (2026-09-18): per-request timing for scripts/latency-sample.mjs.
# The default `combined` format has no $request_time, so p50/p95 per route
# class stay null until this format is live. It is the combined format plus
# two trailing fields ($request_time $upstream_response_time) — the sampler
# parses both shapes, so old and new lines can coexist in one file.
# Apply (main session / founder, NOT from a worktree):
#   1. copy this log_format block into the http{} context
#      (/etc/nginx/nginx.conf, next to the existing `access_log` line, or a
#      new /etc/nginx/conf.d/blockid-timing.conf) — log_format is http-level only;
#   2. in the blockid.au server{} below, add
#        access_log /var/log/nginx/access.log blockid_timing;   ← APPLIED on the server 2026-09-18 (nginx.conf http{} log_format + this server block; backups *.bak-20260918-g15)
#   3. nginx -t && systemctl reload nginx
#   4. node scripts/latency-sample.mjs --dry-run   → p50/p95 populated.
# log_format blockid_timing '$remote_addr - $remote_user [$time_local] '
#                           '"$request" $status $body_bytes_sent '
#                           '"$http_referer" "$http_user_agent" '
#                           '$request_time $upstream_response_time';

server {
    listen 80;
    listen 443 ssl;
    server_name blockid.au www.blockid.au;
    ssl_certificate /etc/nginx/ssl/blockid.crt;
    ssl_certificate_key /etc/nginx/ssl/blockid.key;
    # 2026-09-19: no limit here meant nginx's 1 MB default — every pitch-deck
    # upload over 1 MB (/analyze → /api/intake, /api/upload, evidence uploads)
    # got a bare nginx 413 the UI rendered as "Something went wrong". 50 MB
    # matches /api/upload's own cap; the app enforces tighter per-route caps.
    # APPLIED on the server 2026-09-19 (backup blockid-live.bak-20260919).
    client_max_body_size 50M;
    # G15-R2: uncomment once the http-level log_format above is installed.
    # access_log /var/log/nginx/access.log blockid_timing;

    # Canonical host + scheme (QA lead audit 2026-09-14 F3/F9): Cloudflare
    # forwards plain-http visitors with X-Forwarded-Proto: http, and www is a
    # duplicate of the apex. One 301 to https://blockid.au/… for both.
    if ($http_x_forwarded_proto = "http") { return 301 https://blockid.au$request_uri; }
    if ($host = "www.blockid.au") { return 301 https://blockid.au$request_uri; }

    # Long-running / streamed AI routes
    location ~ ^/api/(svi|rnd|report|reports|site-crawl|funding/report|valuation|pitch-deck|clevel|agents|expenses/categorise|term-sheet|data-room/share)(/|$) {
        proxy_pass http://blockid_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://blockid_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

