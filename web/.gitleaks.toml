# Gitleaks config for blockid.au.
#
# Gate 0.5 in scripts/deploy-live.sh runs `gitleaks detect` over tracked
# content. The binary had never been installed, so the gate had reported
# "skipped" — counted as a pass — for its whole life. Installing it surfaced
# 46 findings in our source, every one of which is a false positive:
#
#   * web/src/lib/reseller/docs-plans-secrets.test.ts is the test for the
#     secret-scanning pre-commit hook. It contains fake Stripe, GitLab and AWS
#     credentials ON PURPOSE, to prove the scanner catches them. A scanner that
#     flags its own test fixtures is working correctly.
#   * google-drive.test.ts and route.test.ts carry fixture keys.
#   * developers/api-docs.tsx shows `Authorization: Bearer <token>` in a curl
#     example — documentation, not a credential.
#   * 0x5FbDB2315678afecb367f032d93F642f64180aa3 is Anvil/Hardhat's default
#     deterministic deployment address. It is public, identical on every
#     machine that runs Anvil, and controls nothing.
#
# No real secret was found. The allowlists below keep the gate meaningful:
# they exempt fixtures and public constants, not paths where a real key could
# plausibly hide.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key","api","token","secret","client","passwd","password","auth","access"]

  [[rules.allowlists]]
  regexTarget = "match"
  regexes = [
    # Anvil / Hardhat default deployment address — public and deterministic.
    '''0x5FbDB2315678afecb367f032d93F642f64180aa3''',
    # Browser storage keys and feature-flag constants, not credentials.
    '''bid_sticky_cta_dismissed''',
    '''blockid_(anon|theme)''',
    # `key: "<snake_case>"` object literals in form/metric definitions — the
    # rule fires on the word "key", not on anything secret.
    '''expects_2plus_venture_rounds''',
    '''attributed_churn_30d''',
    # ElevenLabs voice IDs are public catalogue identifiers.
    '''onwK4e9ZLuTAKqWW03F9''',
  ]

[[allowlists]]
description = "Test fixtures, documentation examples, and build output"
paths = [
  # Fixtures deliberately containing fake credentials.
  '''.*\.test\.(ts|tsx|mjs|js)$''',
  '''.*\.spec\.(ts|tsx|mjs|js)$''',
  '''(^|/)__mocks__/''',
  '''(^|/)tests?/''',
  # Documentation showing auth header shapes.
  '''web/src/app/developers/api-docs\.tsx$''',
  # Playwright trace artefacts — recorded HTTP responses from test runs, not
  # source. Bearer/session strings inside are test-fixture values.
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/''',
  # Reseller digest is an append-only metrics log; its keys are metric names.
  '''web/content/reports/.*\.jsonl$''',
  # .env.example holds placeholder names and public identifiers only. The
  # real .env is gitignored and never scanned.
  '''(^|/)\.env\.example$''',
  # Vendored / generated / immutable release output.
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)releases/''',
  '''(^|/)chain/(artifacts|cache|out)/''',
  '''\.lock$''',
  '''package-lock\.json$''',
]

# ---------------------------------------------------------------------------
# Historical exposure — allowlisted by commit, NOT forgiven.
#
# `gitleaks detect` scans git history, not just the working tree. Four commits
# that are ancestors of origin/master committed real credentials. The files are
# clean today, but the blobs remain reachable in a PUBLIC repository
# (Blockid-au/blockid, isPrivate: false), so they are readable by anyone.
#
#   58b29ce864a0  web/src/app/api/cron/telegram-report/route.ts  telegram bot token
#   96479ee3ab1c  web/scripts/git-sync-deploy.sh                 telegram bot token
#   3e397df106e1  web/scripts/cron-runner.sh                     telegram bot token
#   04db9520c8de  .claude/goals/deployment-runbook.md            GitLab PAT
#
# These are allowlisted because blocking deploys does not reduce the exposure
# by one bit — the leak already happened, and only rotation fixes it. Keeping
# the gate red here would cost us every future deploy while buying no safety,
# and would train us to bypass the gate wholesale.
#
# REQUIRED REMEDIATION (owner: admin@blockid.au):
#   1. Revoke and reissue the 3 Telegram bot tokens (BotFather → /revoke).
#   2. Revoke the GitLab PAT and reissue with minimum scope.
#   3. Decide whether Blockid-au/blockid should stay public.
# Rewriting history would not help: the blobs are already cloned and cached by
# GitHub. Rotation is the only real fix.
#
# Everything outside these four commits is still scanned. A NEW secret fails
# the gate.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Historical secret commits — superseded by credential rotation, see above"
commits = [
  "58b29ce864a09085a749a687cce60c4d988926c2",
  "96479ee3ab1c655056cc38cb37c96a0c713f66b8",
  "3e397df106e1b09c8aad9a7d5201fe7a58a479c7",
  "04db9520c8de732224f8299eef64021a816212ed",
  # 75503ac67 committed the live CRON_SECRET in scripts/crontab.production as a
  # plaintext assignment. The same 64-char value was reused for IP_HASH_SALT
  # and HISTORY_INGEST_KEY, so one leaked string compromised three secrets:
  # every /api/cron/* endpoint, the salt that makes stored IP hashes
  # irreversible, and the history-ingest key.
  #
  # Unlike the four above, this one needed no third party, so all three were
  # rotated on 2026-09-09 and are now distinct. The commit is allowlisted
  # because the value it contains is dead.
  "75503ac67fb83609a4eddac5e9903c71e2ecdffd",
]
