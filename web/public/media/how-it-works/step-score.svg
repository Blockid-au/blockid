    <g transform="translate(0 14)">
      <rect x="0" y="0" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="0" width="470" height="10" rx="5" fill="#38BDF8"/>
      <rect x="0" y="24" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="24" width="380" height="10" rx="5" fill="#38BDF8"/>
      <rect x="0" y="48" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="48" width="510" height="10" rx="5" fill="#38BDF8"/>
      <rect x="0" y="72" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="72" width="290" height="10" rx="5" fill="#38BDF8"/>
      <rect x="0" y="96" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="96" width="420" height="10" rx="5" fill="#38BDF8"/>
      <rect x="0" y="120" width="560" height="10" rx="5" fill="#22326B"/>
      <rect x="0" y="120" width="350" height="10" rx="5" fill="#38BDF8"/>
