<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Startup Value Index scorecard mock">
  <rect width="640" height="400" fill="#0F1B47"/>
  <rect x="20" y="20" width="600" height="360" rx="12" fill="#131938" stroke="#22326B"/>
  <text x="40" y="55" font-family="Inter,sans-serif" font-size="16" fill="#94A3B8">Startup Value Index</text>
  <text x="40" y="105" font-family="Inter,sans-serif" font-size="64" font-weight="700" fill="#38BDF8">72</text>
  <text x="140" y="105" font-family="Inter,sans-serif" font-size="18" fill="#94A3B8">/ 100 — B+</text>
  <!-- gauge arc -->
  <g transform="translate(430 130)">
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="#22326B" stroke-width="14" stroke-linecap="round"/>
    <path d="M -80 0 A 80 80 0 0 1 55 -58" fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round"/>
    <text x="0" y="20" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" fill="#F8FAFC">72%</text>
  </g>
  <!-- 13 criteria bars -->
