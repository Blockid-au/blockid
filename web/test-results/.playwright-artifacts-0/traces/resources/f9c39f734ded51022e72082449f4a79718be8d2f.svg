  </g>
  <!-- Wordmark -->
  <text x="58" y="28" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="1.6" fill="currentColor">NVIDIA</text>
  <text x="58" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="2.4" fill="currentColor" opacity="0.85">INCEPTION</text>
